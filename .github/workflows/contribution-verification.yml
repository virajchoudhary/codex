name: Contribution verification

on:
  push:
    branches:
      - "contribution/verification-20261022"

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'virajchoudhary/codex'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Prepare bounded D: task root"
        shell: pwsh
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP "cx-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          python -B .github/scripts/run_contribution_verification.py --prepare-environment --task-root $taskRoot

      - name: Run verifier lifecycle self-tests
        shell: pwsh
        run: |
          python -B -c "import os,tempfile; from pathlib import Path; root=Path(os.environ['CONTRIB_TASK_ROOT']).resolve(); temp=Path(tempfile.gettempdir()).resolve(); assert temp.is_relative_to(root), f'test temp escaped managed root: {temp}'; print(f'Python test temp root: {temp}')"
          python -B -m unittest discover -s .github/scripts -p "test_run_contribution_verification.py" -v

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy,rustfmt,rust-src

      - name: Run remaining Windows TUI tests
        shell: pwsh
        env:
          RUST_MIN_STACK: "8388608"
        run: python -B .github/scripts/run_contribution_verification.py --run --task-root $env:CONTRIB_TASK_ROOT --tests tui-startup-defaults

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: contribution-verification-windows-${{ github.sha }}
          path: ${{ runner.temp }}/cx-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: warn
          retention-days: 7

  macos:
    if: github.repository == 'virajchoudhary/codex'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare bounded RUNNER_TEMP task root
        shell: bash
        run: |
          task_root="${RUNNER_TEMP}/codex-contribution-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -B .github/scripts/run_contribution_verification.py --prepare-environment --task-root "$task_root"

      - name: Run verifier lifecycle self-tests
        shell: bash
        run: |
          python3 -B -c "import os,tempfile; from pathlib import Path; root=Path(os.environ['CONTRIB_TASK_ROOT']).resolve(); temp=Path(tempfile.gettempdir()).resolve(); assert temp.is_relative_to(root), f'test temp escaped managed root: {temp}'; print(f'Python test temp root: {temp}')"
          python3 -B -m unittest discover -s .github/scripts -p "test_run_contribution_verification.py" -v

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy,rustfmt,rust-src

      - name: Run remaining macOS TUI tests
        shell: bash
        env:
          RUST_MIN_STACK: "8388608"
        run: python3 -B .github/scripts/run_contribution_verification.py --run --task-root "$CONTRIB_TASK_ROOT" --tests tui-startup-defaults

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: contribution-verification-macos-${{ github.sha }}
          path: ${{ runner.temp }}/codex-contribution-verification-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: warn
          retention-days: 7
